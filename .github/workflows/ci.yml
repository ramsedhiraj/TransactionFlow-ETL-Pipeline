name: TransactionFlow CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-unit-tests:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Checks
        run: |
          ruff check src tests scripts mock_api

      - name: Run Ruff Formatting Check
        run: |
          ruff format --check src tests scripts mock_api

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  integration-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transactionflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize PostgreSQL Schema
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d transactionflow -f sql/schema.sql

      - name: Execute Integration Tests against Live PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/transactionflow
          PYTHONPATH: .
        run: |
          pytest -v tests/test_database.py tests/test_pipeline_integration.py

      - name: Test End-to-End Pipeline Ingestion against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/transactionflow
          PYTHONPATH: .
        run: |
          echo "Generating 10,000 synthetic transactions for CI smoke test..."
          python scripts/generate_transactions.py --records 10000 --output data/ci_smoke_10k.csv --seed 99
          echo "Running ETL pipeline into PostgreSQL..."
          python scripts/run_pipeline.py --source-type CSV --source data/ci_smoke_10k.csv --batch-size 5000 --summary-json data/ci_summary.json
          cat data/ci_summary.json
